<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Env Accounts 로고 후보</title>
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#6b7280; --line:#e5e7eb; --card:#f6f8fa; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --card:#161b22; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 "Segoe UI","Malgun Gothic",sans-serif; }
  .wrap { max-width:960px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; margin:0 0 4px; } p.sub { color:var(--muted); margin:0 0 20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
  .card { border:1px solid var(--line); background:var(--card); border-radius:12px; padding:16px; }
  .card h2 { font-size:15px; margin:0 0 2px; } .card p { color:var(--muted); margin:0 0 12px; font-size:13px; }
  .sizes { display:flex; align-items:flex-end; gap:16px; }
  .sizes figure { margin:0; text-align:center; color:var(--muted); font-size:11px; }
  .sizes svg { display:block; margin-bottom:4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Env Accounts 로고 후보</h1>
  <p class="sub">크기별(128 / 48 / 16px)로 알아볼 수 있는지도 함께 확인하세요. 크롬 툴바에서는 16~32px로 보입니다.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
const concepts = [
  { n:"A. 열쇠", d:"가장 직관적. '로그인 계정'이 바로 읽힘.",
    svg:`<rect width="128" height="128" rx="28" fill="#0969da"/>
      <circle cx="46" cy="64" r="15" fill="none" stroke="#fff" stroke-width="9"/>
      <path d="M61 64H102M88 64v15M100 64v11" stroke="#fff" stroke-width="9" stroke-linecap="round" fill="none"/>` },
  { n:"B. 환경 레이어", d:"겹친 두 층 = 개발(초록)·시험(노랑) 환경. 열쇠구멍으로 계정 암시.",
    svg:`<rect width="128" height="128" rx="28" fill="#1f2937"/>
      <path d="M64 48 108 70 64 92 20 70Z" fill="#3fb950"/>
      <path d="M64 28 108 50 64 72 20 50Z" fill="#d29922"/>
      <circle cx="64" cy="48" r="7" fill="#1f2937"/><rect x="61" y="48" width="6" height="14" rx="2" fill="#1f2937"/>` },
  { n:"C. 분기 노드", d:"한 사람(계정)이 여러 환경으로 연결되는 모양. 개발자 느낌.",
    svg:`<rect width="128" height="128" rx="28" fill="#0969da"/>
      <path d="M64 40 38 90M64 40 90 90" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <circle cx="64" cy="38" r="13" fill="#fff"/>
      <circle cx="38" cy="92" r="13" fill="#3fb950" stroke="#fff" stroke-width="5"/>
      <circle cx="90" cy="92" r="13" fill="#d29922" stroke="#fff" stroke-width="5"/>` },
  { n:"D. 방패 + 열쇠", d:"안전한 접근. '운영 제외'라는 안전 원칙을 강조.",
    svg:`<rect width="128" height="128" rx="28" fill="#0d1117"/>
      <path d="M64 18 102 33V64C102 87 85 101 64 110 43 101 26 87 26 64V33Z" fill="#0969da"/>
      <circle cx="64" cy="55" r="10" fill="none" stroke="#fff" stroke-width="6"/>
      <path d="M64 65V88M64 80h10" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/>` },
  { n:"E. 모노그램 EA", d:"글자형. 가장 단순하고 사내 도구 느낌. 두 점은 개발·시험.",
    svg:`<rect width="128" height="128" rx="28" fill="#0969da"/>
      <text x="64" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="52" fill="#fff">EA</text>
      <circle cx="46" cy="98" r="6" fill="#3fb950"/><circle cx="64" cy="98" r="6" fill="#d29922"/>` }
];
document.getElementById("grid").innerHTML = concepts.map(c => `
  <div class="card"><h2>${c.n}</h2><p>${c.d}</p>
  <div class="sizes">${[128,48,16].map(s=>`<figure><svg width="${s}" height="${s}" viewBox="0 0 128 128">${c.svg}</svg>${s}px</figure>`).join("")}</div></div>`).join("");
</script>
</body>
</html>
