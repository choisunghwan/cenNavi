<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CenNavi</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body class="panel chat">
<header class="chat-head">
  <div class="head-row"><h1><img class="logo" src="../icons/icon32.png" alt="">CenNavi</h1><div class="head-actions"><button type="button" class="icon-button" data-new aria-label="새 대화" title="새 대화">＋</button><button type="button" class="icon-button" data-menu-toggle aria-label="도구와 설정" aria-expanded="false" aria-controls="assistantMenu" title="도구와 설정">⋯</button></div></div>
  <div id="status" class="status none"></div>
</header>

<main id="feed" class="feed"></main>

<footer class="composer">
  <div id="slashMenu" class="slash hidden"></div>
  <form id="form" autocomplete="off">
    <textarea id="cmd" rows="2" spellcheck="false" aria-label="메시지" placeholder="무엇을 도와드릴까요?"></textarea>
    <div class="composer-bottom"><span class="composer-context">현재 페이지와 함께</span><button type="submit" class="send" title="메시지 전송" aria-label="메시지 전송">↑</button><button type="button" class="send stop" data-stop title="답변 중지" aria-label="답변 중지" hidden>■</button></div>
  </form>
  <div class="composer-hint">Enter 전송 <span>·</span> Shift+Enter 줄바꿈</div>
</footer>

<div id="toast" class="toast">복사됨</div>
<script src="../shared/sample-pack.js"></script>
<script src="../shared/match.js"></script>
<script src="../shared/core.js"></script>
<script src="../shared/local-config.js"></script>
<script src="../shared/gemini.js"></script>
<script src="../shared/conversation.js"></script>
<script src="../shared/targets.js"></script>
<script src="../shared/chat.js"></script>
<script src="pagereader.js"></script>
<script src="interaction.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
